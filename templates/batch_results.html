<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Results - Image Accuracy Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
  <div class="container">
    <div class="batch-header">
      <h1>📊 Batch Results</h1>
      <div class="header-actions">
        <a href="/" class="btn">⬅ Back</a>
      </div>
    </div>
    
    <div id="results-summary" hidden>
      <p>🏆 <span id="result-count"></span> participants ranked by accuracy</p>
      <div class="action-bar">
        <button class="action-btn" onclick="exportCSV()">📥 Export CSV</button>
        <button class="action-btn secondary" onclick="newRound()">🔄 New Round</button>
      </div>
    </div>
    
    <div id="loading-results" class="loading-results">
      <div class="spinner"></div>
      <p>Loading results...</p>
    </div>
    
    <div id="no-results" class="glass" hidden>
      <p>No results found. <a href="/">Upload images</a> to compare.</p>
    </div>
    
    <div id="results-content" class="results-table-wrapper" hidden>
      <table class="results-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Image</th>
            <th>Filename</th>
            <th>Similarity</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  
  <script>
    const PER_PAGE = 20;
    let results = [];
    let currentPage = 1;
    
    function getScoreColor(score) {
      if (score >= 80) return '#22c55e';
      if (score >= 60) return '#eab308';
      if (score >= 40) return '#f97316';
      return '#ef4444';
    }
    
    function renderPage(page) {
      currentPage = page;
      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';
      const start = (page - 1) * PER_PAGE;
      const end = Math.min(start + PER_PAGE, results.length);
      
      for (let i = start; i < end; i++) {
        const r = results[i];
        const rank = i + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : (rank <= 10 ? 'rank-4' : '');
        const isTop10 = rank <= 10;
        const color = getScoreColor(r.overall);
        
        const row = document.createElement('tr');
        if (isTop10) row.className = 'row-top-10';
        row.innerHTML = `
          <td><span class="rank-badge ${rankClass}">${rank}</span>
          <td>${r.thumbnail ? `<img src="${r.thumbnail}" alt="${r.filename}" class="thumbnail">` : `<div class="thumbnail" style="background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:20px;">🖼</div>`}</td>
          <td>${r.filename}${isTop10 ? '<span class="top10-label">TOP 10</span>' : ''}</td>
          <td>
            <div style="display:flex;align-items:center;gap:12px;">
              <div class="score-bar">
                <div class="score-fill" style="width:${r.overall}%;background:${color};"></div>
              </div>
              <strong>${r.overall.toFixed(1)}%</strong>
            </div>
          </td>
          <td><button class="details-btn" onclick="toggleBreakdown(${i})">Details</button></td>
        `;
        row.dataset.index = i;
        tbody.appendChild(row);
        
        // Breakdown row
        const br = document.createElement('tr');
        br.className = 'breakdown';
        br.id = `breakdown-${i}`;
        br.innerHTML = `
          <td colspan="5">
            <div class="breakdown-grid">
              <div class="breakdown-item">
                <div class="label">SSIM</div>
                <div class="value" style="color:${getScoreColor(r.ssim)}">${r.ssim.toFixed(1)}%</div>
              </div>
              <div class="breakdown-item">
                <div class="label">ORB</div>
                <div class="value" style="color:${getScoreColor(r.orb)}">${r.orb.toFixed(1)}%</div>
              </div>
              <div class="breakdown-item">
                <div class="label">Histogram</div>
                <div class="value" style="color:${getScoreColor(r.histogram)}">${r.histogram.toFixed(1)}%</div>
              </div>
              <div class="breakdown-item">
                <div class="label">pHash</div>
                <div class="value" style="color:${getScoreColor(r.phash)}">${r.phash.toFixed(1)}%</div>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(br);
      }
      
      renderPagination();
    }
    
    function renderPagination() {
      const pages = Math.ceil(results.length / PER_PAGE);
      const container = document.getElementById('pagination');
      container.innerHTML = '';
      
      const prev = document.createElement('button');
      prev.textContent = '◀';
      prev.disabled = currentPage === 1;
      prev.onclick = () => renderPage(currentPage - 1);
      container.appendChild(prev);
      
      for (let i = 1; i <= pages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => renderPage(i);
        container.appendChild(btn);
      }
      
      const next = document.createElement('button');
      next.textContent = '▶';
      next.disabled = currentPage === pages;
      next.onclick = () => renderPage(currentPage + 1);
      container.appendChild(next);
    }
    
    function exportCSV() {
      let csv = 'Rank,Filename,Overall,SSIM,ORB,Histogram,pHash\n';
      results.forEach((r, i) => {
        csv += `${i + 1},${r.filename},${r.overall.toFixed(1)}%,${r.ssim.toFixed(1)}%,${r.orb.toFixed(1)}%,${r.histogram.toFixed(1)}%,${r.phash.toFixed(1)}%\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'accuracy-results.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function newRound() {
      if (confirm('Start a new round? This will clear the current results.')) {
        sessionStorage.removeItem('batchResults');
        window.location.href = '/';
      }
    }
    
    function toggleBreakdown(index) {
      const el = document.getElementById(`breakdown-${index}`);
      el.classList.toggle('visible');
    }
    
    // Load results
    document.addEventListener('DOMContentLoaded', () => {
      const stored = sessionStorage.getItem('batchResults');
      if (stored) {
        results = JSON.parse(stored);
        document.getElementById('result-count').textContent = results.length;
        document.getElementById('results-summary').hidden = false;
        document.getElementById('loading-results').hidden = true;
        document.getElementById('results-content').hidden = false;
        renderPage(1);
      } else {
        document.getElementById('loading-results').hidden = true;
        document.getElementById('no-results').hidden = false;
      }
    });
    
    // Theme toggle
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-theme');
      themeBtn.textContent = isLight ? '☀️' : '🌙';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
      themeBtn.textContent = '☀️';
    }
  </script>
</body>
</html>
