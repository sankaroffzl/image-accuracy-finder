<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Results - Image Accuracy Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Inter', system-ui, sans-serif;
        --color-primary: #2563EB;
        --color-primary-dark: #1E40AF;
      }
    </style>
    <style>
      .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .breakdown { display: none; }
      .breakdown.visible { display: table-row; }
      .breakdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .breakdown-item { text-align: center; }
      .breakdown-item .label { font-size: .75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
      .breakdown-item .value { font-size: 1.1rem; font-weight: 700; }
      .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; font-weight: 700; font-size: .85rem; }
      .rank-1 { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #1e1b4b; }
      .rank-2 { background: linear-gradient(135deg,#e2e8f0,#cbd5e1); color: #1e1b4b; }
      .rank-3 { background: linear-gradient(135deg,#d97706,#b45309); color: #fff; }
      .rank-4 { background: #e0e7ff; color: #3730a3; }
      .rank-other { background: #f1f5f9; color: #94a3b8; }
      .score-bar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; min-width: 120px; }
      .score-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }
      .thumbnail { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: #f1f5f9; }
      .pagination button { padding: 6px 14px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; color: #475569; font-size: .875rem; cursor: pointer; transition: all .15s ease; }
      .pagination button:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
      .pagination button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
      .pagination button:disabled { opacity: .4; cursor: not-allowed; }
      .btn { display: inline-flex; align-items: center; gap: 6px; }
      .theme-toggle { background: none; border: none; cursor: pointer; font-size: 1.25rem; padding: 8px; border-radius: 8px; transition: background .15s ease; position: fixed; top: 16px; right: 16px; z-index: 50; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .theme-toggle:hover { background: #f1f5f9; }
      .details-btn { padding: 4px 12px; font-size: .8rem; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: #2563eb; cursor: pointer; transition: all .15s ease; }
      .details-btn:hover { background: #eff6ff; border-color: #93c5fd; }
      .top10-label { display: inline-block; margin-left: 8px; padding: 1px 8px; font-size: .7rem; font-weight: 600; color: #92400e; background: #fef3c7; border-radius: 4px; }
      .action-btn { padding: 10px 20px; border-radius: 8px; font-weight: 500; font-size: .875rem; cursor: pointer; transition: all .15s ease; border: none; }
      .action-btn.primary { background: #2563eb; color: #fff; }
      .action-btn.primary:hover { background: #1d4ed8; }
      .action-btn.secondary { background: #fff; color: #475569; border: 1px solid #e2e8f0; }
      .action-btn.secondary:hover { background: #f1f5f9; }
      .row-top-10 { background: #fefce8; }
      .glass { padding: 40px; text-align: center; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; }
      .loading-results { padding: 60px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; color: #64748b; }
      body.light-theme { background: #fff !important; }
      body.light-theme .batch-header { border-color: #e2e8f0; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 font-sans antialiased">
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
  <div class="container max-w-6xl mx-auto px-4 py-10">
    <div class="batch-header flex justify-between items-center mb-8 p-6 bg-white rounded-xl shadow-sm border border-slate-200">
      <h1 class="text-2xl font-bold text-slate-900">📊 Batch Results</h1>
      <div class="header-actions flex gap-3 items-center">
        <a href="/" class="btn px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">⬅ Back</a>
      </div>
    </div>
    
    <div id="results-summary" class="p-6 mb-8 bg-white rounded-xl shadow-sm border border-slate-200" hidden>
      <p class="text-slate-700 font-medium mb-4">🏆 <span id="result-count"></span> participants ranked by accuracy</p>
      <div class="action-bar flex gap-3">
        <button class="action-btn primary" onclick="exportCSV()">📥 Export CSV</button>
        <button class="action-btn secondary" onclick="newRound()">🔄 New Round</button>
      </div>
    </div>
    
    <div id="loading-results" class="loading-results">
      <div class="spinner"></div>
      <p>Loading results...</p>
    </div>
    
    <div id="no-results" class="glass" hidden>
      <p class="text-slate-500">No results found. <a href="/" class="text-blue-600 hover:text-blue-700 underline">Upload images</a> to compare.</p>
    </div>
    
    <div id="results-content" class="results-table-wrapper bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden" hidden>
      <table class="results-table w-full">
        <thead>
          <tr class="bg-slate-50 text-left">
            <th class="px-5 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">#</th>
            <th class="px-5 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Image</th>
            <th class="px-5 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Filename</th>
            <th class="px-5 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Similarity</th>
            <th class="px-5 py-4"></th>
          </tr>
        </thead>
        <tbody id="results-body" class="divide-y divide-slate-100"></tbody>
      </table>
      <div class="pagination flex justify-center gap-2 py-5 border-t border-slate-200" id="pagination"></div>
    </div>
  </div>
  
  <script>
    const PER_PAGE = 20;
    let results = [];
    let currentPage = 1;
    
    function getScoreColor(score) {
      if (score >= 80) return '#22c55e';
      if (score >= 60) return '#eab308';
      if (score >= 40) return '#f97316';
      return '#ef4444';
    }
    
    function renderPage(page) {
      currentPage = page;
      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';
      const start = (page - 1) * PER_PAGE;
      const end = Math.min(start + PER_PAGE, results.length);
      
      for (let i = start; i < end; i++) {
        const r = results[i];
        const rank = i + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : (rank <= 10 ? 'rank-4' : '');
        const isTop10 = rank <= 10;
        const color = getScoreColor(r.overall);
        
        const row = document.createElement('tr');
        if (isTop10) row.className = 'row-top-10';
        row.innerHTML = `
          <td><span class="rank-badge ${rankClass}">${rank}</span></td>
          <td>${r.thumbnail ? `<img src="${r.thumbnail}" alt="${r.filename}" class="thumbnail">` : `<div class="thumbnail" style="background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:20px;">🖼</div>`}</td>
          <td>${r.filename}${isTop10 ? '<span class="top10-label">TOP 10</span>' : ''}</td>
          <td>
            <div style="display:flex;align-items:center;gap:12px;">
              <div class="score-bar">
                <div class="score-fill" style="width:${r.overall || 0}%;background:${color};"></div>
              </div>
              <strong>${(r.overall || 0).toFixed(1)}%</strong>
            </div>
          </td>
          <td><button class="details-btn" onclick="toggleBreakdown(${i})">Details</button></td>
        `;
        row.dataset.index = i;
        tbody.appendChild(row);
        
        // Breakdown row
        const br = document.createElement('tr');
        br.className = 'breakdown';
        br.id = `breakdown-${i}`;
        const ssim = r.ssim || 0;
        const orb = r.orb || 0;
        const hist = r.histogram || 0;
        const phash = r.phash || 0;
        br.innerHTML = `
          <td colspan="5">
            <div class="breakdown-grid">
              <div class="breakdown-item">
                <div class="label">SSIM</div>
                <div class="value" style="color:${getScoreColor(ssim)}">${ssim.toFixed(1)}%</div>
              </div>
              <div class="breakdown-item">
                <div class="label">ORB</div>
                <div class="value" style="color:${getScoreColor(orb)}">${orb.toFixed(1)}%</div>
              </div>
              <div class="breakdown-item">
                <div class="label">Histogram</div>
                <div class="value" style="color:${getScoreColor(hist)}">${hist.toFixed(1)}%</div>
              </div>
              <div class="breakdown-item">
                <div class="label">pHash</div>
                <div class="value" style="color:${getScoreColor(phash)}">${phash.toFixed(1)}%</div>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(br);
      }
      
      renderPagination();
    }
    
    function renderPagination() {
      const pages = Math.ceil(results.length / PER_PAGE);
      const container = document.getElementById('pagination');
      container.innerHTML = '';
      
      const prev = document.createElement('button');
      prev.textContent = '◀';
      prev.disabled = currentPage === 1;
      prev.onclick = () => renderPage(currentPage - 1);
      container.appendChild(prev);
      
      for (let i = 1; i <= pages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => renderPage(i);
        container.appendChild(btn);
      }
      
      const next = document.createElement('button');
      next.textContent = '▶';
      next.disabled = currentPage === pages;
      next.onclick = () => renderPage(currentPage + 1);
      container.appendChild(next);
    }
    
    function exportCSV() {
      let csv = 'Rank,Filename,Overall,SSIM,ORB,Histogram,pHash\n';
      results.forEach((r, i) => {
        const ssim = r.ssim || 0;
        const orb = r.orb || 0;
        const hist = r.histogram || 0;
        const phash = r.phash || 0;
        csv += `${i + 1},${r.filename},${(r.overall || 0).toFixed(1)}%,${ssim.toFixed(1)}%,${orb.toFixed(1)}%,${hist.toFixed(1)}%,${phash.toFixed(1)}%\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'accuracy-results.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function newRound() {
      if (confirm('Start a new round? This will clear the current results.')) {
        sessionStorage.removeItem('batchResults');
        window.location.href = '/';
      }
    }
    
    function toggleBreakdown(index) {
      const el = document.getElementById(`breakdown-${index}`);
      el.classList.toggle('visible');
    }
    
    // Load results
    document.addEventListener('DOMContentLoaded', () => {
      const stored = sessionStorage.getItem('batchResults');
      if (stored) {
        try {
          results = JSON.parse(stored);
          if (!Array.isArray(results) || results.length === 0) throw new Error('No results');
        } catch (e) {
          sessionStorage.removeItem('batchResults');
          document.getElementById('loading-results').hidden = true;
          document.getElementById('no-results').querySelector('p').textContent = 
            'Results data was corrupted. Please go back and compare again.';
          document.getElementById('no-results').hidden = false;
          return;
        }
        document.getElementById('result-count').textContent = results.length;
        document.getElementById('results-summary').hidden = false;
        document.getElementById('loading-results').hidden = true;
        document.getElementById('results-content').hidden = false;
        renderPage(1);
      } else {
        document.getElementById('loading-results').hidden = true;
        document.getElementById('no-results').hidden = false;
      }
    });
    
    // Theme toggle
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-theme');
      themeBtn.textContent = isLight ? '☀️' : '🌙';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
      themeBtn.textContent = '☀️';
    }
  </script>
</body>
</html>
